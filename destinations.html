<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Explorer | Destinations</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">🌍 TravelExplorer</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="destinations.html"
                >Destinations</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="container my-5">
      <h1 class="text-center mb-4">Explore Destinations</h1>

      <!-- Filter Buttons -->
      <div class="d-flex flex-wrap justify-content-center gap-2 mb-4">
        <button class="btn btn-primary filter-btn active" data-filter="all">
          All
        </button>
        <button
          class="btn btn-outline-primary filter-btn"
          data-filter="beaches"
        >
          Beaches
        </button>
        <button
          class="btn btn-outline-primary filter-btn"
          data-filter="mountains"
        >
          Mountains
        </button>
        <button class="btn btn-outline-primary filter-btn" data-filter="cities">
          Cities
        </button>
      </div>

      <!-- Destinations Grid -->
      <div class="row g-4" id="destinationsContainer">
        <!-- Cards will be generated by JavaScript -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <div class="container">
        <p class="mb-0">&copy; 2026 Travel Explorer. All rights reserved.</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
